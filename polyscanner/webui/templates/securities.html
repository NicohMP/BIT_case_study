{% extends "base.html" %}
{% block title %}Securities · Polymarket Signal Scanner{% endblock %}
{% block content %}
  <h1>Securities</h1>
  <div class="card">
    <table class="table">
      <thead>
        <tr>
          <th>Ticker</th>
          <th>Company</th>
          <th>MIC</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for s in securities %}
        <tr>
          <td><code>{{ s.ticker }}</code></td>
          <td>{{ s.company_name }}</td>
          <td class="muted">{{ s.exchange_mic }}</td>
          <td><a href="/securities/{{ s.security_id }}">exposure</a> · <a href="/signals?security_id={{ s.security_id }}">signals</a></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
